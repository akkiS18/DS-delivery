apply plugin: 'com.android.application'

android {
    namespace = "com.dsdelivery.customer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dsdelivery.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release builds pass -PdsVersionCode=N -PdsVersionName=x.y.z (Android needs a higher versionCode for every update).
        versionCode Integer.parseInt((project.findProperty('dsVersionCode') ?: '1').toString())
        versionName "${project.findProperty('dsVersionName') ?: '1.0'}"
        // A side-by-side TEST build (-PdsTestInstall=1, see scripts/build-release-apks.ps1 -TestInstall): its own application id and name, so it installs next to the Play app instead of replacing it.
        if (project.hasProperty('dsTestInstall')) {
            applicationIdSuffix ".test"
            manifestPlaceholders = [appLabel: "DS Test"]
        } else {
            manifestPlaceholders = [appLabel: "DS Delivery"]
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing (Stage 8C): keystore and passwords come from the environment ONLY (DS_KEYSTORE_FILE, DS_KEYSTORE_PASSWORD, DS_KEY_ALIAS,
    // DS_KEY_PASSWORD), never from the repository. Without them the release APK stays UNSIGNED, never silently debug-signed.
    def dsKeystore = System.getenv('DS_KEYSTORE_FILE')
    if (dsKeystore) {
        signingConfigs {
            release {
                storeFile file(dsKeystore)
                storePassword System.getenv('DS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DS_KEY_ALIAS')
                keyPassword System.getenv('DS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (dsKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Background push (FCM / google-services) is NOT implemented in this MVP.
