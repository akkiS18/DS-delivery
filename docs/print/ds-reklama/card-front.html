<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>DS vizitka old</title>
<!-- Business card front: 90x50 mm trim + 2 mm bleed = 94x54 mm. -->
<link rel="stylesheet" href="assets/style.css">
<style>
  @page { size: 94mm 54mm; }
  html, body { width: 94mm; height: 54mm; overflow: hidden; }
  .card { position: relative; width: 94mm; height: 54mm; overflow: hidden; color: #fff; }
  .left { position: absolute; left: 6mm; top: 6mm; bottom: 6mm; width: 46mm; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 2mm; }
  .head img { height: 8.4mm; display: block; }
  .brand b { display: block; font-size: 3.9mm; font-weight: 850; line-height: 1; }
  .brand span { display: block; font-size: 1.9mm; font-weight: 600; opacity: .85; margin-top: .7mm; letter-spacing: .15mm; text-transform: uppercase; }
  h1 { margin-top: auto; font-weight: 900; line-height: 1.02; letter-spacing: -.12mm; }
  h1 .l1 { display: block; font-size: 4.3mm; }
  h1 .l2 { display: block; font-size: 6.3mm; color: var(--y); margin-top: .4mm; }
  .ride { position: absolute; right: 3mm; bottom: 6mm; width: 40mm; height: 31mm; }
  .ride [data-icon] { position: absolute; filter: drop-shadow(0 .6mm .6mm rgba(0,0,0,.25)); }
  .road { position: absolute; left: 50mm; right: 0; bottom: 6.4mm; height: .6mm; background: rgba(255,255,255,.35); border-radius: 1mm; }
</style></head>
<body>
<div class="card green-bg">
  <div class="dot" style="width:44mm;height:44mm;right:-14mm;top:-20mm"></div>
  <div class="road"></div>
  <div class="left">
    <div class="head">
      <img src="assets/logo-white.png" alt="DS">
      <div class="brand"><b>DS Dostavka</b><span>taom yetkazib berish</span></div>
    </div>
    <h1><span class="l1">Buyurtma bering —</span><span class="l2">olib boramiz</span></h1>
  </div>
  <div class="ride">
    <i data-icon="scooter" style="left:0;bottom:0;width:40mm;height:30.8mm"></i>
    <i data-icon="burger" style="left:5.6mm;top:-2.2mm;width:11.5mm;height:11.5mm"></i>
    <i data-icon="fries" style="left:14.5mm;top:-4.4mm;width:9.5mm;height:9.5mm;transform:rotate(12deg)"></i>
    <i data-icon="pizza" style="left:-1.6mm;top:-4mm;width:9mm;height:9mm;transform:rotate(-18deg)"></i>
  </div>
</div>
<script src="assets/icons.js"></script>
<script>mountIcons();</script>
</body></html>
