<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>DS vizitka orqa</title>
<!-- Business card back: 90x50 mm trim + 2 mm bleed = 94x54 mm. -->
<link rel="stylesheet" href="assets/style.css">
<style>
  @page { size: 94mm 54mm; }
  html, body { width: 94mm; height: 54mm; overflow: hidden; }
  .card { position: relative; width: 94mm; height: 54mm; overflow: hidden; background: var(--cream); color: var(--ink); }
  .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 6mm; }
  .qrbox { position: absolute; left: 10mm; top: 7mm; width: 40mm; height: 40mm; background: #fff; border-radius: 3mm; padding: 1.6mm; box-shadow: 0 .5mm 1.6mm rgba(6,63,46,.18); }
  .qrbox .qr { width: 100%; height: 100%; }
  .txt { position: absolute; left: 54mm; right: 5mm; top: 8mm; }
  .txt .k { font-size: 2.2mm; font-weight: 750; letter-spacing: .3mm; text-transform: uppercase; color: var(--g2); }
  .txt h2 { margin-top: 1.4mm; font-size: 4.05mm; font-weight: 900; line-height: 1.05; }
  .txt .bot { margin-top: 2.2mm; display: flex; align-items: center; gap: 1mm; font-size: 2.45mm; font-weight: 650; color: #2B5B4C; }
  .txt .bot i { width: 2.9mm; height: 2.9mm; flex: none; }
  .row { position: absolute; left: 54mm; top: 32.5mm; display: flex; gap: 1.3mm; }
  .row i { width: 6.4mm; height: 6.4mm; }
  .insta { position: absolute; right: 4.5mm; bottom: 4.2mm; display: flex; align-items: center; gap: .9mm; font-size: 2.3mm; font-weight: 700; color: var(--g2); }
  .insta i { width: 2.7mm; height: 2.7mm; color: var(--g2); }
</style></head>
<body>
<div class="card">
  <div class="stripe green-bg"></div>
  <div class="qrbox"><div class="qr" data-qr="https://t.me/ds_dostavka_bot" data-logo="assets/logo-color.png"></div></div>
  <div class="txt">
    <div class="k">Telegram orqali</div>
    <h2>Skanerlang va<br>buyurtma bering</h2>
    <div class="bot"><i data-icon="telegram"></i>@ds_dostavka_bot</div>
  </div>
  <div class="row"><i data-icon="burger"></i><i data-icon="pizza"></i><i data-icon="lavash"></i><i data-icon="fries"></i><i data-icon="cola"></i></div>
  <div class="insta"><i data-icon="instagram"></i>@ds.dostavka</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/icons.js"></script><script src="assets/qr.js"></script>
<script>mountIcons(); mountQR();</script>
</body></html>
